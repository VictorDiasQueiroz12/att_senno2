<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alberto&Livros</title>
</head>
<body>
<h1>Cadastrar Autor</h1>
<input id="nomeAutor" placeholder="Nome do Autor">
<button id="btnAutor">Salvar Autor</button>

<h2>Autores (tabela)</h2>
<table border="1">
    <thead>
        <tr>
            <th>id</th>
            <th>nome</th>
        </tr>
    </thead>
    <tbody id="tabelaAutores"></tbody>
</table>

<h1>Cadastrar Livros</h1>
<input id="nomeLivro" placeholder="Nome do Livro">
<button id="btnLivro">Salvar Livro</button>

<h2>Livros (tabela)</h2>
<table border="1">
    <thead>
        <tr>
            <th>id</th>
            <th>titulo</th>
            <th>autor_id</th>
            <th>nome do autor</th>
        </tr>
    </thead>
    <tbody id="tabelaLivros"></tbody>
</table>


<script>src="script.js"</script>

</body>
</html>
